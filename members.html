<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members | Creators Data Base</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="background">

    <div class="left-line"></div>

    <div class="left-line2"></div>

</div>

<div class="container fadeIn">

    <img src="images/logo.png" class="logo" alt="Creators Logo">

    <h1 class="title">

        MEMBERS

    </h1>

    <p class="subTitle">

        TEAM MEMBER LIST

    </p>

    <!-- 検索（Ver2.1で機能追加予定） -->

    <input
        type="text"
        id="searchBox"
        class="inputBox"
        placeholder="メンバーを検索（準備中）"
        disabled>

    <!-- 並び替え（Ver2.1予定） -->

    <select id="sortSelect" class="inputBox" disabled>

        <option>並び替え（準備中）</option>

    </select>

    <!-- メンバー一覧 -->

    <div id="memberList" class="mt30">

        <div class="loading">

            Loading

        </div>

    </div>

    <!-- ホーム -->

    <a href="index.html" class="adminButton mt40">

        🏠 ホームへ戻る

    </a>

    <div class="footer">

        Creators Data Base Ver.2

    </div>

</div>

<script src="js/members.js"></script>

</body>

</html>
