<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マイページ | Creators Data Base</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="background">

<div class="left-line"></div>

<div class="left-line2"></div>

</div>

<div class="container fadeIn">

<img src="images/logo.png" class="logo" alt="Creators Logo">

<h1 class="title">

MY PAGE

</h1>

<p class="subTitle">

CREATORS DATA BASE

</p>

<!-- プロフィール -->

<div class="card profileCard">

<img

id="memberIcon"

src="images/default.png"

class="memberIcon"

alt="icon">

<h2 id="memberName">

読み込み中...

</h2>

<p id="memberId">

ID

</p>

</div>

<!-- ポイント -->

<div class="card">

<h2>

⭐ ポイント

</h2>

<div

id="memberPoint"

class="pointDisplay">

0 PT

</div>

</div>

<!-- 戦績 -->

<div class="card">

<h2>

🏆 戦績

</h2>

<div class="recordGrid">

<div>

優勝

<p id="championCount">0</p>

</div>

<div>

準優勝

<p id="runnerUpCount">0</p>

</div>

<div>

Best4

<p id="best4Count">0</p>

</div>

<div>

Best8

<p id="best8Count">0</p>

</div>

<div>

参加

<p id="entryCount">0</p>

</div>

</div>

</div>

<!-- 使用ベイ -->

<div class="card">

<h2>

⚔ 使用ベイ

</h2>

<select

id="partnerSelect"

class="inputBox">

<option>

読み込み中...

</option>

</select>

</div>

<!-- 称号 -->

<div class="card">

<h2>

🎖 称号

</h2>

<select

id="titleSelect"

class="inputBox">

<option>

読み込み中...

</option>

</select>

</div>

<!-- 保存 -->

<div class="card">

<button

id="saveButton"

class="yellowButton">

保存

</button>

</div>

<!-- 景品交換 -->

<div class="card">

<a

href="reward.html"

class="yellowButton">

🎁 景品交換

</a>

</div>

<!-- メンバー一覧 -->

<div class="card">

<a

href="members.html"

class="adminButton">

👥 メンバー一覧へ

</a>

</div>

<div class="footer">

Creators Data Base Ver.2

</div>

</div>

<script src="js/mypage.js"></script>

</body>

</html>
