<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>大会戦績登録 | Creators Data Base</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
    rel="stylesheet"
>

</head>


<body>


<div class="background">

    <div class="left-line"></div>

    <div class="left-line2"></div>

</div>



<div class="container fadeIn">


    <!-- ============================== -->
    <!-- ロゴ -->
    <!-- ============================== -->

    <img
        src="images/logo.png"
        class="logo"
        alt="Creators Logo"
    >



    <!-- ============================== -->
    <!-- タイトル -->
    <!-- ============================== -->

    <h1 class="title">

        TOURNAMENT

    </h1>


    <p class="subTitle">

        RECORD MANAGEMENT

    </p>



    <!-- ============================== -->
    <!-- 大会選択 -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            🏆 大会

        </h2>


        <p class="infoTitle">

            登録する大会を選択してください

        </p>


        <select
            id="tournamentSelect"
            class="inputBox"
        >

            <option value="">

                大会を選択してください

            </option>

        </select>

    </div>



    <!-- ============================== -->
    <!-- 優勝 -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            🥇 優勝

        </h2>


        <p class="infoTitle">

            チーム戦の場合は3人まで登録できます

        </p>



        <select
            id="championSelect1"
            class="inputBox memberSelect"
        >

            <option value="">

                1人目を選択してください

            </option>

        </select>



        <select
            id="championSelect2"
            class="inputBox memberSelect"
        >

            <option value="">

                2人目を選択してください

            </option>

        </select>



        <select
            id="championSelect3"
            class="inputBox memberSelect"
        >

            <option value="">

                3人目を選択してください

            </option>

        </select>

    </div>



    <!-- ============================== -->
    <!-- 準優勝 -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            🥈 準優勝

        </h2>


        <p class="infoTitle">

            チーム戦の場合は3人まで登録できます

        </p>



        <select
            id="runnerUpSelect1"
            class="inputBox memberSelect"
        >

            <option value="">

                1人目を選択してください

            </option>

        </select>



        <select
            id="runnerUpSelect2"
            class="inputBox memberSelect"
        >

            <option value="">

                2人目を選択してください

            </option>

        </select>



        <select
            id="runnerUpSelect3"
            class="inputBox memberSelect"
        >

            <option value="">

                3人目を選択してください

            </option>

        </select>

    </div>



    <!-- ============================== -->
    <!-- 3位 -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            🥉 3位

        </h2>


        <p class="infoTitle">

            チーム戦の場合は3人まで登録できます

        </p>



        <select
            id="thirdSelect1"
            class="inputBox memberSelect"
        >

            <option value="">

                1人目を選択してください

            </option>

        </select>



        <select
            id="thirdSelect2"
            class="inputBox memberSelect"
        >

            <option value="">

                2人目を選択してください

            </option>

        </select>



        <select
            id="thirdSelect3"
            class="inputBox memberSelect"
        >

            <option value="">

                3人目を選択してください

            </option>

        </select>

    </div>



    <!-- ============================== -->
    <!-- ベスト4 -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            🏅 ベスト4

        </h2>


        <p class="infoTitle">

            チーム戦の場合は3人まで登録できます

        </p>



        <select
            id="best4Select1"
            class="inputBox memberSelect"
        >

            <option value="">

                1人目を選択してください

            </option>

        </select>



        <select
            id="best4Select2"
            class="inputBox memberSelect"
        >

            <option value="">

                2人目を選択してください

            </option>

        </select>



        <select
            id="best4Select3"
            class="inputBox memberSelect"
        >

            <option value="">

                3人目を選択してください

            </option>

        </select>

    </div>



    <!-- ============================== -->
    <!-- メモ -->
    <!-- ============================== -->

    <div class="card">

        <h2>

            📝 メモ

        </h2>


        <textarea
            id="memo"
            rows="5"
            placeholder="大会結果についてのメモ"
        ></textarea>

    </div>



    <!-- ============================== -->
    <!-- 登録 -->
    <!-- ============================== -->

    <div class="card">

        <button
            id="saveRecord"
            class="yellowButton"
        >

            大会結果を登録

        </button>

    </div>



    <!-- ============================== -->
    <!-- 戻る -->
    <!-- ============================== -->

    <div class="card">

        <a
            href="admin.html"
            class="adminButton"
        >

            ← 管理画面へ戻る

        </a>

    </div>



    <!-- ============================== -->
    <!-- Footer -->
    <!-- ============================== -->

    <div class="footer">

        Creators Data Base Ver.2.3

    </div>


</div>



<!-- ============================== -->
<!-- JavaScript -->
<!-- ============================== -->

<script
    src="js/record.js"
></script>


</body>

</html>
