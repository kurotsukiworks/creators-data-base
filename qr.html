<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>QR読み込み | Creators Data Base</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
    rel="stylesheet"
>

</head>


<body>


<div class="background">

    <div class="left-line"></div>

    <div class="left-line2"></div>

</div>



<div class="container fadeIn">


    <!-- ロゴ -->

    <img
        src="images/logo.png"
        class="logo"
        alt="Creators Logo"
    >


    <!-- タイトル -->

    <h1 class="title">

        QR SCAN

    </h1>


    <p class="subTitle">

        CREATORS DATA BASE

    </p>



    <!-- 説明 -->

    <div class="card">


        <h2>

            📷 QRコードを読み込む

        </h2>


        <p>

            Creators Data Base専用QRコードを
            カメラに映してください。

        </p>


        <p>

            ※スマートフォンの標準カメラではなく、
            このページから読み込んでください。

        </p>


    </div>



    <!-- QRカメラ -->

    <div class="card qrCard">


        <div class="qrCamera">


            <video

                id="qrVideo"

                autoplay

                muted

                playsinline

            ></video>


            <!-- スキャン枠 -->

            <div class="qrFrame">

                <span class="corner topLeft"></span>

                <span class="corner topRight"></span>

                <span class="corner bottomLeft"></span>

                <span class="corner bottomRight"></span>

            </div>


        </div>



        <!-- 読み込み状態 -->

        <div

            id="qrResult"

            class="qrResult"

        >

            カメラを起動しています...

        </div>


    </div>



    <!-- 戻る -->

    <div class="card">


        <a

            href="index.html"

            class="adminButton"

        >

            ← トップへ戻る

        </a>


    </div>



    <div class="footer">

        Creators Data Base Ver.2

    </div>


</div>



<!-- ============================== -->
<!-- jsQR -->
<!-- ============================== -->

<script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>



<!-- ============================== -->
<!-- QR Script -->
<!-- ============================== -->

<script
    src="js/qr.js">
</script>


</body>

</html>
